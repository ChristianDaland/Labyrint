<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101a14">
<title>Gull-egget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #101a14; --moss: #22352a; --moss-2: #2f4a39; --gold: #f2c14e;
    --fox: #e2662a; --cream: #f3ead2; --muted: #a9b8a6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--cream);
    font-family: 'Nunito', system-ui, sans-serif; overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none;
    touch-action: manipulation; /* iOS ignorerer user-scalable=no; dette hindrer dobbelttrykk-zoom */ }
  .hidden { display: none !important; }
  h1, h2 { font-family: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif; font-weight: 400; margin: 0; }

  .screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top)); }
  .card { width: min(360px, 100%); text-align: center; }
  .egg { width: 84px; height: 108px; margin: 0 auto 18px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 35% 30%, #fff6c9 0 8%, #f7d46a 22%, #d99a1e 70%, #9a6510 100%);
    box-shadow: 0 0 40px rgba(242,193,78,.45); }
  h1 { font-size: 44px; color: var(--gold); line-height: 1; }
  .card p { color: var(--muted); font-size: 16px; line-height: 1.45; margin: 12px 0 22px; }
  input { width: 100%; font: 800 20px 'Nunito', sans-serif; padding: 14px 16px; border-radius: 14px;
    border: 2px solid var(--moss-2); background: var(--moss); color: var(--cream); outline: none;
    user-select: text; -webkit-user-select: text; text-align: center; }
  input:focus { border-color: var(--gold); }
  .cta { width: 100%; margin-top: 12px; font: 400 24px 'Lilita One', sans-serif; padding: 14px; border: 0;
    border-radius: 14px; background: var(--gold); color: #3b2805; }
  .cta:active { transform: translateY(2px); }
  .me { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid rgba(255,255,255,.6); }

  #game { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #view { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top));
    pointer-events: none; text-shadow: 0 1px 3px #000; }
  #hearts { font-size: 22px; letter-spacing: 2px; }
  #tag { display: flex; align-items: center; gap: 8px; font-weight: 800; background: rgba(0,0,0,.35);
    padding: 4px 10px 4px 6px; border-radius: 99px; }
  #flash { position: absolute; inset: 0; background: rgba(200,20,20,.55); opacity: 0; pointer-events: none;
    transition: opacity .5s; }
  #danger { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    box-shadow: inset 0 0 60px 20px rgba(226,102,42,.75); }
  #msg { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: max-content;
    max-width: 90%; text-align: center; background: rgba(16,26,20,.85); border: 2px solid var(--gold);
    padding: 8px 14px; border-radius: 12px; font-weight: 800; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #msg.show { opacity: 1; }

  #pad { flex: 0 0 auto; height: max(210px, 34vh); display: flex; justify-content: space-between; align-items: center;
    gap: 16px; padding: 14px 18px; padding-bottom: calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(#1a2a20, #101a14); border-top: 3px solid #0a110d; }
  .cluster { display: flex; gap: 12px; }
  .cluster.vert { flex-direction: column; }
  .btn { width: 84px; height: 84px; border-radius: 22px; border: 0; display: grid; place-items: center;
    background: var(--moss-2); box-shadow: 0 6px 0 #0d1611, inset 0 2px 0 rgba(255,255,255,.08);
    touch-action: none; color: var(--cream); }
  .btn svg { width: 40px; height: 40px; }
  .btn.on { transform: translateY(4px); box-shadow: 0 2px 0 #0d1611; background: #3d5f49; color: var(--gold); }
  .cluster.vert .btn { height: 74px; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }

  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,16,12,.86);
    padding: 24px; z-index: 5; }
  #overlay h2 { font-size: 34px; color: var(--gold); line-height: 1.1; }
  #ovIcon { font-size: 64px; margin-bottom: 10px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>

<div id="join" class="screen">
  <div class="card">
    <div class="egg"></div>
    <h1>Gull-egget</h1>
    <p>Finn gull-egget i labyrinten før de andre. Ser du en rev, snu og løp!</p>
    <input id="name" maxlength="14" placeholder="Navnet ditt" autocomplete="off" enterkeyhint="go">
    <button id="joinBtn" class="cta">Bli med</button>
  </div>
</div>

<div id="wait" class="screen hidden">
  <div class="card">
    <div class="egg"></div>
    <div class="me"><span class="dot"></span><span class="meName"></span></div>
    <p>Du er med! Runden starter når verten trykker start på storskjermen.</p>
  </div>
</div>

<div id="game" class="hidden">
  <div id="view">
    <div id="danger"></div>
    <div id="flash"></div>
    <div id="hud"><div id="hearts"></div><div id="tag"><span class="dot"></span><span class="meName"></span></div></div>
    <div id="msg"></div>
  </div>
  <div id="pad">
    <div>
      <div class="cluster">
        <button class="btn" data-k="left" aria-label="Snu til venstre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="btn" data-k="right" aria-label="Snu til høyre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="hint">Snu</div>
    </div>
    <div>
      <div class="cluster vert">
        <button class="btn" data-k="up" aria-label="Gå fram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></button>
        <button class="btn" data-k="down" aria-label="Gå bak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div id="overlay" class="hidden">
  <div class="card"><div id="ovIcon"></div><h2 id="ovTitle"></h2><p id="ovText"></p></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as THREE from 'three';

// ─── Konstanter (fart må matche CONFIG.playerSpeed på serveren) ─────────
const SPEED = 2.4, TURN = 2.6, RADIUS = 0.22, WALL_H = 1.4, EYE = 0.62;

const $ = s => document.querySelector(s);
const socket = io();
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

let me = null, key = store.get('gullegg-key'), joinedName = null;
let phase = 'lobby', grid = null, out = false, lives = 3, maxLives = 3, spawnId = 0;
const pos = { x: 1.5, z: 1.5, a: 0 };
const input = { up: false, down: false, left: false, right: false };

function show(id) {
  for (const s of ['join', 'wait', 'game']) $('#' + s).classList.toggle('hidden', s !== id);
  if (id === 'game') resize();
}

// ─── Innlogging ─────────────────────────────────────────────────────────
const nameInput = $('#name');
nameInput.value = store.get('gullegg-name') || '';
function join() {
  const n = nameInput.value.trim();
  if (!n) { nameInput.focus(); return; }
  joinedName = n;
  store.set('gullegg-name', n);
  nameInput.blur();
  socket.emit('join', { key, name: n });
  keepAwake();
}
$('#joinBtn').onclick = join;
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') join(); });

socket.on('connect', () => { if (joinedName) socket.emit('join', { key, name: joinedName }); });
socket.on('joined', d => {
  me = d; key = d.key; store.set('gullegg-key', key);
  document.querySelectorAll('.meName').forEach(e => e.textContent = d.name);
  document.querySelectorAll('.dot').forEach(e => e.style.background = d.color);
  if (phase === 'lobby') show('wait');
});
socket.on('lobby', d => {
  if (d.phase === 'lobby' && phase !== 'lobby') { phase = 'lobby'; $('#overlay').classList.add('hidden'); }
  if (d.phase === 'lobby' && me) show('wait');
});
socket.on('game', d => {
  phase = d.phase; maxLives = d.lives;
  if (JSON.stringify(d.grid) !== JSON.stringify(grid)) buildLevel(d.grid);
  placeEgg(d.egg);
  pos.x = d.you.x; pos.z = d.you.z; pos.a = d.you.a;
  spawnId = d.you.s; lives = d.you.lives; out = d.you.out;
  renderHearts();
  show('game');
  if (d.phase === 'ended' && d.result) showEnd(d.result);
  else { $('#overlay').classList.add('hidden'); message(out ? 'Du er ute – se på resten av runden' : 'Finn gull-egget!', 2500); }
});
socket.on('state', applyState);
socket.on('egg', placeEgg);
socket.on('hit', d => {
  lives = d.lives; renderHearts();
  $('#flash').style.transition = 'none'; $('#flash').style.opacity = 1;
  requestAnimationFrame(() => { $('#flash').style.transition = 'opacity .8s'; $('#flash').style.opacity = 0; });
  if (navigator.vibrate) navigator.vibrate(300);
  if (d.out) { out = true; message('Reven tok deg – du er ute! 🦊', 0); return; }
  if (d.respawn) { pos.x = d.respawn.x; pos.z = d.respawn.z; pos.a = d.respawn.a; spawnId = d.respawn.s; }
  message(`Au! Reven tok deg. ${lives} liv igjen${d.respawn ? ', tilbake til start' : ''}`, 2600);
});
socket.on('end', showEnd);

function showEnd(r) {
  phase = 'ended';
  let icon = '🦊', title = 'Revene vant!', text = 'Vent på neste runde.';
  if (r.type === 'player') {
    icon = '🥚';
    title = me && r.id === me.id ? 'Du fant gull-egget!' : `${r.name} fant gull-egget!`;
  } else if (r.type === 'fox') title = 'En rev tok gull-egget!';
  else title = 'Revene tok alle!';
  $('#ovIcon').textContent = icon; $('#ovTitle').textContent = title; $('#ovText').textContent = text;
  $('#overlay').classList.remove('hidden');
}

function renderHearts() {
  $('#hearts').textContent = '❤️'.repeat(Math.max(lives, 0)) + '🖤'.repeat(Math.max(maxLives - lives, 0));
}
let msgTimer = null;
function message(text, ms) {
  const el = $('#msg'); el.textContent = text; el.classList.add('show');
  clearTimeout(msgTimer);
  if (ms) msgTimer = setTimeout(() => el.classList.remove('show'), ms);
}
async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && joinedName) keepAwake(); });

// ─── Styring ────────────────────────────────────────────────────────────
document.querySelectorAll('.btn').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); input[k] = true; b.classList.add('on'); b.setPointerCapture?.(e.pointerId); };
  const off = () => { input[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, off));
});
document.addEventListener('contextmenu', e => e.preventDefault());
const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => { if (KEYS[e.code] && document.activeElement !== nameInput) { input[KEYS[e.code]] = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (KEYS[e.code]) input[KEYS[e.code]] = false; });

// ─── 3D-scene ───────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
$('#view').prepend(renderer.domElement);
const scene = new THREE.Scene();
const FOG = 0x0c1410;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 0.5, 8.5);
const camera = new THREE.PerspectiveCamera(72, 1, 0.05, 40);
scene.add(new THREE.HemisphereLight(0xb8c8ff, 0x2a2018, 1.1));
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const torch = new THREE.PointLight(0xffd9a0, 3.5, 7, 1.2);
scene.add(torch);

function resize() {
  const v = $('#view'); const w = v.clientWidth, h = v.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('#view'));

function canvasTex(size, draw, repeat) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter; // litt retro, som de gamle 3D-spillene
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const brickTex = canvasTex(64, (g, s) => {
  g.fillStyle = '#2a1f19'; g.fillRect(0, 0, s, s);
  const bh = 8;
  for (let r = 0; r < s / bh; r++) {
    const off = (r % 2) * 8;
    for (let x = -16; x < s; x += 16) {
      g.fillStyle = `hsl(${14 + Math.random() * 12}, ${30 + Math.random() * 15}%, ${26 + Math.random() * 12}%)`;
      g.fillRect(x + off + 1, r * bh + 1, 14, bh - 2);
    }
  }
  for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(40,70,30,${Math.random() * 0.35})`; g.fillRect(Math.random() * s, Math.random() * s, 2, 2); }
});

let level = null;
const others = new Map();
let foxes = [];
let eggGroup = null;

// Frigjør GPU-minne for et objekt som fjernes (murstein-teksturen deles og beholdes)
function dispose(root) {
  scene.remove(root);
  root.traverse(o => {
    if (!o.isSprite) o.geometry?.dispose(); // alle sprites deler én geometri
    for (const m of [].concat(o.material || [])) { if (m.map && m.map !== brickTex) m.map.dispose(); m.dispose(); }
  });
}

function buildLevel(g) {
  if (level) dispose(level);
  for (const o of others.values()) dispose(o.group);
  others.clear();
  for (const f of foxes) dispose(f.group);
  foxes = [];
  eggGroup = null;
  grid = g;
  level = new THREE.Group();
  const H = g.length, W = g[0].length;

  let count = 0;
  for (const row of g) for (const c of row) if (c) count++;
  const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(1, WALL_H, 1),
    new THREE.MeshLambertMaterial({ map: brickTex }), count);
  const m = new THREE.Matrix4(); let i = 0;
  for (let z = 0; z < H; z++) for (let x = 0; x < W; x++)
    if (g[z][x]) { m.makeTranslation(x + 0.5, WALL_H / 2, z + 0.5); walls.setMatrixAt(i++, m); }
  level.add(walls);

  const floorTex = canvasTex(32, (c, s) => {
    c.fillStyle = '#3b3a2c'; c.fillRect(0, 0, s, s);
    for (let k = 0; k < 90; k++) { c.fillStyle = `hsl(${60 + Math.random() * 40}, 18%, ${16 + Math.random() * 16}%)`; c.fillRect(Math.random() * s, Math.random() * s, 3, 3); }
    c.strokeStyle = '#2a291f'; c.strokeRect(0.5, 0.5, s - 1, s - 1);
  }, [W, H]);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshLambertMaterial({ map: floorTex }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(W / 2, 0, H / 2);
  level.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshLambertMaterial({ color: 0x15140f }));
  ceil.rotation.x = Math.PI / 2; ceil.position.set(W / 2, WALL_H, H / 2);
  level.add(ceil);

  scene.add(level);
}

// Serveren sender eggets posisjon først når spilleren kan se det
function placeEgg(egg) {
  if (!egg || !level || eggGroup) return;
  eggGroup = makeEgg(); eggGroup.position.set(egg.x, 0, egg.z);
  level.add(eggGroup);
}

function makeEgg() {
  const g = new THREE.Group();
  const egg = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 16),
    new THREE.MeshStandardMaterial({ color: 0xffc83a, metalness: 0.45, roughness: 0.25, emissive: 0x8a5a00, emissiveIntensity: 0.7 }));
  egg.scale.y = 1.3; egg.name = 'egg';
  g.add(egg);
  const glow = new THREE.PointLight(0xffc040, 2.5, 3, 1.5); glow.position.y = 0.3;
  g.add(glow);
  return g;
}

function makeFox() {
  const g = new THREE.Group();
  const orange = new THREE.MeshLambertMaterial({ color: 0xd8601f });
  const white = new THREE.MeshLambertMaterial({ color: 0xf4efe6 });
  const dark = new THREE.MeshLambertMaterial({ color: 0x2b1a12 });
  const add = (geo, mat, x, y, z, rz = 0) => { const o = new THREE.Mesh(geo, mat); o.position.set(x, y, z); o.rotation.z = rz; g.add(o); return o; };
  const body = add(new THREE.BoxGeometry(0.5, 0.2, 0.22), orange, 0, 0.27, 0);
  add(new THREE.BoxGeometry(0.2, 0.18, 0.2), orange, 0.32, 0.36, 0);
  add(new THREE.ConeGeometry(0.07, 0.16, 6), white, 0.48, 0.33, 0, -Math.PI / 2);
  add(new THREE.SphereGeometry(0.025, 6, 6), dark, 0.56, 0.33, 0);
  add(new THREE.ConeGeometry(0.045, 0.11, 4), orange, 0.3, 0.5, 0.06);
  add(new THREE.ConeGeometry(0.045, 0.11, 4), orange, 0.3, 0.5, -0.06);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xc8ff4a }); // lysende øyne i mørket
  add(new THREE.SphereGeometry(0.022, 6, 6), eyeMat, 0.42, 0.4, 0.06);
  add(new THREE.SphereGeometry(0.022, 6, 6), eyeMat, 0.42, 0.4, -0.06);
  add(new THREE.ConeGeometry(0.08, 0.34, 6), orange, -0.4, 0.32, 0, Math.PI / 2 + 0.3);
  add(new THREE.SphereGeometry(0.05, 6, 6), white, -0.57, 0.27, 0);
  const legs = [];
  for (const [x, z] of [[0.18, 0.08], [0.18, -0.08], [-0.18, 0.08], [-0.18, -0.08]])
    legs.push(add(new THREE.BoxGeometry(0.06, 0.18, 0.06), dark, x, 0.09, z));
  g.userData = { body, legs };
  return g;
}

const fontReady = document.fonts ? document.fonts.load('800 34px Nunito').catch(() => {}) : Promise.resolve();

function nameSprite(name, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const draw = () => {
    g.clearRect(0, 0, 256, 64);
    g.font = '800 34px Nunito, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const w = Math.min(g.measureText(name).width + 36, 252);
    g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect((256 - w) / 2, 6, w, 52, 26); g.fill();
    g.fillStyle = color; g.fillText(name, 128, 33);
    t.needsUpdate = true;
  };
  draw();
  fontReady.then(draw); // tegn på nytt med Nunito hvis skriften ikke var lastet ennå
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true }));
  s.scale.set(0.8, 0.2, 1);
  return s;
}

function makeAvatar(p) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: p.color });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.45, 12), mat); body.position.y = 0.3;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 10), new THREE.MeshLambertMaterial({ color: 0xf1d2b6 }));
  head.position.y = 0.63;
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
  for (const z of [0.045, -0.045]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.018, 6, 6), eyeMat); e.position.set(0.11, 0.65, z); g.add(e); }
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.125, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat); cap.position.y = 0.66;
  g.add(body, head, cap);
  const label = nameSprite(p.name, p.color); label.position.y = 0.95; g.add(label);
  scene.add(g);
  return { group: g, x: p.x, z: p.z, a: p.a, tx: p.x, tz: p.z, ta: p.a, inv: false };
}

function applyState(d) {
  if (!grid) return;
  const seen = new Set();
  for (const p of d.players) {
    if (me && p.id === me.id) { if (p.lives !== lives) { lives = p.lives; renderHearts(); } continue; }
    seen.add(p.id);
    let o = others.get(p.id);
    if (!o) { o = makeAvatar(p); others.set(p.id, o); }
    o.tx = p.x; o.tz = p.z; o.ta = p.a; o.inv = p.inv; o.out = p.out;
  }
  for (const [id, o] of others) if (!seen.has(id)) { dispose(o.group); others.delete(id); }
  while (foxes.length < d.foxes.length) { const g = makeFox(); scene.add(g); foxes.push({ group: g, x: d.foxes[foxes.length].x, z: d.foxes[foxes.length].z, a: 0 }); }
  d.foxes.forEach((f, i) => Object.assign(foxes[i], { tx: f.x, tz: f.z, ta: f.a, c: f.c }));
}

// ─── Bevegelse og kollisjon ─────────────────────────────────────────────
const isWall = (x, z) => { const row = grid[Math.floor(z)]; return !row || row[Math.floor(x)] !== 0; };
const blocked = (x, z) => isWall(x - RADIUS, z - RADIUS) || isWall(x + RADIUS, z - RADIUS) ||
  isWall(x - RADIUS, z + RADIUS) || isWall(x + RADIUS, z + RADIUS);

let walkPhase = 0;
function moveSelf(dt) {
  pos.a += ((input.right ? 1 : 0) - (input.left ? 1 : 0)) * TURN * dt;
  const f = (input.up ? 1 : 0) - (input.down ? 0.7 : 0);
  if (!f) return;
  const dx = Math.cos(pos.a) * f * SPEED * dt, dz = Math.sin(pos.a) * f * SPEED * dt;
  if (!blocked(pos.x + dx, pos.z)) pos.x += dx;
  if (!blocked(pos.x, pos.z + dz)) pos.z += dz;
  walkPhase += dt * 11;
}

setInterval(() => {
  if (phase === 'playing' && !out && grid) socket.emit('pos', { x: pos.x, z: pos.z, a: pos.a, s: spawnId });
}, 66);

const lerpAngle = (a, b, t) => a + (Math.atan2(Math.sin(b - a), Math.cos(b - a))) * t;

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - last) / 1000, 0.1); last = t;
  if (!grid) return;
  if (phase === 'playing' && !out) moveSelf(dt);
  const k = 1 - Math.exp(-dt * 12);

  for (const o of others.values()) {
    o.x += (o.tx - o.x) * k; o.z += (o.tz - o.z) * k; o.a = lerpAngle(o.a, o.ta, k);
    o.group.position.set(o.x, 0, o.z); o.group.rotation.y = -o.a;
    o.group.visible = !o.out && (!o.inv || Math.floor(t / 120) % 2 === 0);
  }
  let danger = 0;
  for (const f of foxes) {
    if (f.tx === undefined) continue;
    const moved = Math.hypot(f.tx - f.x, f.tz - f.z);
    f.x += (f.tx - f.x) * k; f.z += (f.tz - f.z) * k; f.a = lerpAngle(f.a, f.ta, k);
    f.group.position.set(f.x, 0, f.z); f.group.rotation.y = -f.a;
    const run = Math.sin(t / (f.c ? 50 : 80)) * (moved > 0.005 ? 1 : 0);
    f.group.userData.legs.forEach((l, i) => l.rotation.z = run * 0.6 * (i % 2 ? 1 : -1));
    const d = Math.hypot(f.x - pos.x, f.z - pos.z);
    if (f.c && d < 5) danger = Math.max(danger, 1 - d / 5);
  }
  $('#danger').style.opacity = out ? 0 : danger.toFixed(2);

  if (eggGroup) {
    const egg = eggGroup.getObjectByName('egg');
    egg.position.y = 0.3 + Math.sin(t / 400) * 0.05; egg.rotation.y = t / 700;
  }

  const moving = input.up || input.down;
  camera.position.set(pos.x, EYE + (moving && !out ? Math.sin(walkPhase) * 0.025 : 0), pos.z);
  camera.rotation.y = -pos.a - Math.PI / 2;
  torch.position.copy(camera.position);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
